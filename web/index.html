<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            background: #333;
            color: #9092b1;
        }

        #start {
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            display: block;
        }

        a:link,
        a:visited {
            color: #ffffff;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div style="width:100%;height:100%;max-width:100%" id="start">
        <div id="game"></div>
        <p id="browser-warning" style="display: none; position: absolute; top: 0; left: 0; width: 100%; font-family: 'Courier New', Courier, monospace; background: #be1414; color: #ffcb00; margin: 0; text-align: center;">&#128165; This works better on Chromium-based browsers!</p>
    </div>
    <script>
        const isChromeOrChromium = /Chrome/i.test(navigator.userAgent) || /Chromium/i.test(navigator.userAgent);
        if (!isChromeOrChromium) {
            document.querySelector("#browser-warning").style.display = "block";
        }

        EJS_player = "#game";
        EJS_core = "gba";
        EJS_gameName = "DoomEscaping";
        EJS_color = "#af54ff";
        EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
        EJS_gameUrl = "doom-escaping.gba";
        EJS_backgroundImage = "https://img.itch.zone/aW1nLzMwNTA5MDkxLnBuZw==/315x250%23c/U%2FvZCl.png";
        EJS_backgroundBlur = true;
        EJS_defaultControls = {
            0: {
                0: {
                    'value': 'z',
                    'value2': 'BUTTON_1'
                },
                2: {
                    'value': 'v',
                    'value2': 'SELECT'
                },
                3: {
                    'value': 'enter',
                    'value2': 'START'
                },
                4: {
                    'value': 'up arrow',
                    'value2': 'DPAD_UP'
                },
                5: {
                    'value': 'down arrow',
                    'value2': 'DPAD_DOWN'
                },
                6: {
                    'value': 'left arrow',
                    'value2': 'DPAD_LEFT'
                },
                7: {
                    'value': 'right arrow',
                    'value2': 'DPAD_RIGHT'
                },
                8: {
                    'value': 'x',
                    'value2': 'BUTTON_2'
                },
                10: {
                    'value': 'a',
                    'value2': 'LEFT_TOP_SHOULDER'
                },
                11: {
                    'value': 's',
                    'value2': 'RIGHT_TOP_SHOULDER'
                }
            },
            1: {},
            2: {},
            3: {}
        };
    </script>

    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>

</html>
